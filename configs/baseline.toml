schema_version = 1
config_kind = "defaults"
name = "baseline-v0.1"

[dataset]
name = "hotpot_qa"
variant = "distractor"
revision = "UNRESOLVED"

[model]
family = "Qwen3"
scale = "4B"
checkpoint = "UNRESOLVED"
revision = "UNRESOLVED"

[agent]
actions = ["SEARCH", "ANSWER"]
context_policy = "append_only"
max_policy_searches = 5

[retrieval.local]
backend = "bm25"
b = 0.75
k1 = 1.5
tokenizer = "unicode_word_lower_v1"

[retrieval.production]
backend = "faiss_bge"
embedding_model = "BAAI/bge-large-en-v1.5"
embedding_model_revision = "d4aa6901d3a41ba39fb536a557fa166f842b0e09"
framework = "agent-r1"
index_factory = "Flat"
metric = "inner_product"
query_instruction = "Represent this sentence for searching relevant passages: "
revision = "b124aa46534cbf2fb8bc8af11405774984c42ac7"

[reward]
answer = "normalized_exact_match"
intermediate = 0.0
search_cost = 0.0
token_cost = 0.0

[credit]
assignment = "terminal_only"

[training]
algorithm = "grpo"
framework = "agent-r1_verl"
framework_revision = "UNRESOLVED"

[evaluation]
metrics = [
  "exact_match",
  "token_f1",
  "success_rate",
  "search_calls",
  "tokens",
  "evidence_recall_when_labeled",
]

[resolution]
required_fields = [
  "dataset.revision",
  "model.checkpoint",
  "model.revision",
  "training.framework_revision",
  "run.seed",
]
