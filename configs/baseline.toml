schema_version = 1
config_kind = "defaults"
name = "baseline-v0.1"

[dataset]
name = "hotpot_qa"
variant = "distractor"
revision = "UNRESOLVED"

[model]
family = "Qwen3"
scale = "4B"
checkpoint = "Qwen/Qwen3-4B-Instruct-2507"
revision = "cdbee75f17c01a7cc42f958dc650907174af0554"

[agent]
actions = ["SEARCH", "ANSWER"]
context_policy = "append_only"
max_policy_searches = 5
max_steps = 8
action_format = "strict_search_answer_v1"
malformed_action = "append_feedback_and_continue"

[rollout]
prompt_format = "qwen3_strict_search_answer_v1"
max_prompt_tokens = 8192
max_new_tokens_per_step = 96

[retrieval.local]
backend = "bm25"
b = 0.75
k1 = 1.5
tokenizer = "unicode_word_lower_v1"

[retrieval.production]
backend = "faiss_bge"
embedding_model = "BAAI/bge-large-en-v1.5"
embedding_model_revision = "d4aa6901d3a41ba39fb536a557fa166f842b0e09"
framework = "agent-r1"
index_factory = "Flat"
metric = "inner_product"
query_instruction = "Represent this sentence for searching relevant passages: "
revision = "b124aa46534cbf2fb8bc8af11405774984c42ac7"

[reward]
answer = "normalized_exact_match"
intermediate = 0.0
search_cost = 0.0
token_cost = 0.0

[credit]
assignment = "terminal_only"

[training]
algorithm = "grpo"
framework = "agent-r1_verl"
framework_revision = "UNRESOLVED"

[evaluation]
protocol = "baseline_evaluation_v1"
policy_conditions = ["no_search", "prompted_agent", "rl_agent"]
final_split = "validation"
final_examples = 7405
debug_selection = "ordered_prefix_non_benchmark"
answer_alias_reduction = "maximum"
coverage = "exactly_once_in_canonical_order"
per_example_source_of_truth = true
metrics = [
  "exact_match",
  "token_f1",
  "success_rate",
  "completion_rate",
  "attempted_searches",
  "search_calls",
  "tokens",
  "evidence_recall_when_labeled",
]

[evaluation.inference]
decoding = "greedy"
seed = 0
max_new_tokens_per_step = 96
max_prompt_tokens = 8192

[evaluation.retrieval]
top_k = 3
evidence_document_reduction = "union_across_executed_searches"

[resolution]
required_fields = [
  "dataset.revision",
  "model.checkpoint",
  "model.revision",
  "training.framework_revision",
  "run.seed",
]
