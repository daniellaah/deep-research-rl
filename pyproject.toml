[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepresearch-rl"
version = "0.1.0.dev0"
description = "A reproducible research platform for reinforcement-learned multi-step retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy==1.11.2",
  "pytest==8.4.2",
  "ruff==0.16.4",
]
retrieval = [
  "accelerate==1.14.0",
  "datasets==5.0.1",
  "faiss-cpu==1.12.0",
  "FlagEmbedding==1.3.5",
  "huggingface-hub==0.34.4",
  "numpy==2.2.6",
  "peft==0.20.0",
  "sentence-transformers==5.7.0",
  "torch==2.14.0",
  "transformers==4.57.6",
]
rollout = [
  "accelerate==1.14.0",
  "huggingface-hub==0.34.4",
  "torch==2.14.0",
  "transformers==4.57.6",
]

[project.scripts]
deep-research-rl = "deep_research_rl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deep_research_rl = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: exercises an optional production-style dependency boundary",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
